
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Art Walker</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;
 place-items:center;background:#e9e5dc;
 font-family:Georgia,serif
}
.paper{
 width:min(94vw,760px);aspect-ratio:16/10;
 background:#f7f3e9;border-radius:14px;
 box-shadow:0 18px 50px #302b2020;
 overflow:hidden;position:relative
}
svg{width:100%;height:100%}
.ink{fill:none;stroke:#34332e;stroke-width:2.2;
 stroke-linecap:round;stroke-linejoin:round}
.fine{fill:none;stroke:#777064;stroke-width:1.15;
 stroke-linecap:round}
.accent{fill:#8b9b9a;stroke:#34332e;stroke-width:1.5}
.body{transform-origin:350px 210px;animation:bob .8s ease-in-out infinite}
.front{transform-origin:350px 250px;animation:front .8s ease-in-out infinite}
.back{transform-origin:350px 250px;animation:back .8s ease-in-out infinite}
.arm1{transform-origin:350px 155px;animation:back .8s ease-in-out infinite}
.arm2{transform-origin:350px 155px;animation:front .8s ease-in-out infinite}
@keyframes bob{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-3px)}
}
@keyframes front{
 0%,100%{transform:rotate(25deg)}
 50%{transform:rotate(-25deg)}
}
@keyframes back{
 0%,100%{transform:rotate(-25deg)}
 50%{transform:rotate(25deg)}
}
</style>
</head>
<body>
<div class="paper">
<svg viewBox="0 0 700 440">
<path class="fine" d="M55 357 Q350 353 645 357"/>
<g class="back">
<path class="ink" d="M342 246 Q335 280 326 305 L315 348"/>
<path class="ink" d="M352 249 Q350 280 343 307 L333 348"/>
<path class="ink" d="M315 348 Q300 355 295 359 Q315 365 337 350"/>
</g>
<g class="front">
<path class="ink" d="M348 245 Q358 278 370 302 L382 348"/>
<path class="ink" d="M359 245 Q371 276 382 299 L396 347"/>
<path class="ink" d="M382 348 Q400 350 409 358 Q395 365 376 357"/>
</g>
<g class="body">
<path class="ink" d="M337 133 Q323 143 321 166 L316 218 Q316 236 329 247 Q348 257 368 246 Q380 237 377 218 L371 163 Q367 143 354 135"/>
<path class="fine" d="M339 139 Q346 153 349 174 Q355 153 359 139"/>
<path class="ink" d="M348 174 Q344 196 349 220"/>
<path class="ink" d="M339 124 L339 140 Q349 149 360 138 L359 122"/>
<path class="ink" d="M329 91 Q331 67 351 65 Q374 66 376 91 L372 119 Q366 135 351 137 Q336 133 330 118 Z"/>
<path class="fine" d="M336 96 Q340 91 345 95 M360 95 Q366 91 370 96"/>
<path class="ink" d="M344 108 Q351 111 357 108"/>
<path class="accent" d="M337 132 Q349 140 362 130 L369 142 Q352 155 334 143 Z"/>
<path class="accent" d="M360 138 Q375 145 384 162 Q374 158 367 166 Z"/>
</g>
<g class="arm1">
<path class="ink" d="M326 151 Q309 169 307 192 L294 225"/>
<path class="ink" d="M337 157 Q322 178 320 196 L306 231"/>
</g>
<g class="arm2">
<path class="ink" d="M369 151 Q385 166 391 187 L408 221"/>
<path class="ink" d="M378 157 Q395 174 400 193 L418 226"/>
</g>
</svg>
</div>
</body>
</html>
