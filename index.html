
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Character Rig</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:#e9e4da;font-family:Georgia,serif
}
.stage{
 width:min(96vw,900px);aspect-ratio:16/10;
 background:#f6f0e5;border-radius:14px;overflow:hidden;
 box-shadow:0 15px 50px #302b2020;position:relative
}
svg{width:100%;height:100%}
.ink{stroke:#39372f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#756d60;stroke-width:1.1;fill:none;stroke-linecap:round}
.skin{fill:#edcdb0}
.coat{fill:#d8c0a5}
.coat2{fill:#e7d2b9}
.hijab{fill:#92958a}
.pants{fill:#77796f}
.shoe{fill:#eee7d9}
.bag{fill:#48443c}
.line{fill:none}
#character{transform-origin:350px 365px}
#torso{transform-origin:350px 220px;animation:torso 1.1s ease-in-out infinite}
#head{transform-origin:350px 140px;animation:head 1.1s ease-in-out infinite}
#scarfTail{transform-origin:330px 140px;animation:scarf 1.1s ease-in-out infinite}
#coatTail{transform-origin:325px 280px;animation:coat 1.1s ease-in-out infinite}
#bag{transform-origin:310px 190px;animation:bag 1.1s ease-in-out infinite}
#frontLeg{transform-origin:350px 285px;animation:legA 1.1s ease-in-out infinite}
#backLeg{transform-origin:350px 285px;animation:legB 1.1s ease-in-out infinite}
#frontArm{transform-origin:370px 180px;animation:armA 1.1s ease-in-out infinite}
#backArm{transform-origin:330px 180px;animation:armB 1.1s ease-in-out infinite}

@keyframes torso{
 0%,100%{transform:translateY(0) rotate(-1deg)}
 50%{transform:translateY(-3px) rotate(1deg)}
}
@keyframes head{
 0%,100%{transform:rotate(1deg)}
 50%{transform:rotate(-1deg)}
}
@keyframes scarf{
 0%,100%{transform:rotate(-2deg)}
 50%{transform:rotate(3deg)}
}
@keyframes coat{
 0%,100%{transform:rotate(-2deg)}
 50%{transform:rotate(3deg)}
}
@keyframes bag{
 0%,100%{transform:rotate(-3deg)}
 50%{transform:rotate(4deg)}
}
@keyframes legA{
 0%,100%{transform:rotate(20deg)}
 50%{transform:rotate(-20deg)}
}
@keyframes legB{
 0%,100%{transform:rotate(-20deg)}
 50%{transform:rotate(20deg)}
}
@keyframes armA{
 0%,100%{transform:rotate(-14deg)}
 50%{transform:rotate(14deg)}
}
@keyframes armB{
 0%,100%{transform:rotate(14deg)}
 50%{transform:rotate(-14deg)}
}
.controls{
 position:absolute;bottom:14px;left:50%;
 transform:translateX(-50%);
 display:flex;gap:9px;align-items:center
}
button{
 border:1px solid #aaa18f;background:#eee7d9;
 color:#39372f;padding:9px 15px;border-radius:30px;
 font-size:13px
}
.paused *{animation-play-state:paused!important}
</style>
</head>
<body>
<div class="stage" id="stage">

</g>

</g>
</svg>

<div class="controls">
 <button onclick="toggle()">Pause / Play</button>
 <button onclick="speed(0.7)">Slow</button>
 <button onclick="speed(1.1)">Normal</button>
</div>
</div>
<script>
const stage=document.getElementById('stage');
function toggle(){stage.classList.toggle('paused')}
function speed(v){
 document.querySelectorAll('#character g').forEach(el=>{
  el.style.animationDuration=(1.1/v)+'s';
 });
}
</script>
</body>
</html>
