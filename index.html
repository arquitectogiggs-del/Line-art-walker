
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hijabi Walker - V3</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #e9e6df;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

.app {
  width: min(960px, 96vw);
  padding: 18px;
}

.scene {
  width: 100%;
  overflow: hidden;
  border-radius: 18px;
  background: #f5f2eb;
  box-shadow: 0 12px 40px #00000012;
}

svg {
  display: block;
  width: 100%;
  height: auto;
}

.ground {
  stroke: #b8b2a7;
  stroke-width: 1.5;
}

.ink {
  stroke: #282725;
  stroke-width: 3.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.cloth {
  fill: #d7cfc1;
  stroke: #282725;
  stroke-width: 3;
  stroke-linejoin: round;
}

.skin {
  fill: #c99578;
  stroke: #282725;
  stroke-width: 2.8;
  stroke-linejoin: round;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 15px 4px 4px;
}

button {
  border: 0;
  border-radius: 20px;
  background: #33312e;
  color: white;
  padding: 10px 22px;
  font-size: 14px;
}

button:active { transform: scale(.97); }

.caption {
  color: #777168;
  font-size: 12px;
  text-align: center;
  margin-top: 10px;
}
</style>
</head>

<body>
<div class="app">

  <div class="scene">
    <svg viewBox="0 0 800 480" id="stage">

      <rect width="800" height="480" fill="#f5f2eb"/>

      <path class="ground" d="M0 390 H800"/>

      <g id="character">

        <!-- الظل -->
        <ellipse id="shadow"
          cx="0" cy="0" rx="38" ry="5"
          fill="#282725" opacity=".12"/>

        <!-- الرجل الخلفية -->
        <g id="backLeg">
          <path id="backLegShape" class="cloth"/>
          <path id="backLegDetail" class="ink"/>
          <path id="backShoe" class="ink"/>
        </g>

        <!-- الرجل الأمامية -->
        <g id="frontLeg">
          <path id="frontLegShape" class="cloth"/>
          <path id="frontLegDetail" class="ink"/>
          <path id="frontShoe" class="ink"/>
        </g>

        <!-- الذراع الخلفية -->
        <g id="backArm">
          <path id="backArmShape"
            d="M-5 -105 Q-20 -65 -17 -30"
            stroke="#282725" stroke-width="15"
            stroke-linecap="round" fill="none"/>
          <path id="backArmDetail" class="ink"/>
          <path id="backHand" class="skin"
            d="M-17 -31 Q-26 -22 -19 -12 Q-10 -8 -8 -20 Z"/>
        </g>

        <!-- الجسم -->
        <g id="body">

          <path class="cloth"
            d="M-17 -112
               Q-36 -107 -39 -82
               L-46 -15
               Q-42 5 -28 9
               L28 9
               Q44 1 42 -18
               L34 -84
               Q30 -108 12 -112 Z"/>

          <path class="ink"
            d="M-26 -87 Q0 -72 28 -88"/>

          <!-- المعطف -->
          <path class="cloth"
            d="M-36 -83
               Q-51 -52 -45 -8
               Q-42 9 -29 17
               L-8 15
               Q-19 -21 -17 -77 Z"/>

          <path class="cloth"
            d="M17 -77
               Q30 -45 25 -10
               Q22 8 38 16
               Q52 2 47 -22
               L34 -84 Z"/>

          <path class="ink"
            d="M-7 -78 Q-2 -40 -5 5"/>

        </g>

        <!-- الذراع الأمامية -->
        <g id="frontArm">
          <path id="frontArmShape"
            d="M27 -103 Q42 -65 35 -30"
            stroke="#282725" stroke-width="16"
            stroke-linecap="round" fill="none"/>
          <path id="frontArmDetail" class="ink"/>
          <path id="frontHand" class="skin"
            d="M29 -31 Q22 -22 29 -12 Q39 -8 40 -20 Z"/>
        </g>

        <!-- الرأس والحجاب -->
        <g id="head">

          <path class="skin"
            d="M-9 -174
               Q-15 -192 1 -200
               Q22 -203 29 -185
               L27 -153
               Q15 -135 -2 -151 Z"/>

          <!-- الحجاب -->
          <path class="cloth"
            d="M-18 -183
               Q-26 -214 4 -219
               Q36 -219 38 -185
               Q42 -151 26 -125
               Q15 -111 -13 -120
               Q-31 -133 -27 -158
               Q-27 -175 -18 -183 Z"/>

          <path class="ink"
            d="M-17 -181
               Q-8 -194 9 -193
               Q25 -190 31 -176"/>

          <path class="ink"
            d="M-24 -151 Q-14 -132 7 -127
               Q20 -124 28 -137"/>

          <!-- الوجه -->
          <path class="skin"
            d="M-7 -183
               Q12 -193 27 -178
               L25 -153
               Q18 -139 5 -143
               Q-8 -148 -11 -163 Z"/>

          <!-- العين والأنف -->
          <path class="ink"
            d="M13 -169 Q18 -172 22 -168"/>
          <path class="ink"
            d="M25 -164 L29 -159 L25 -157"/>

          <path class="ink"
            d="M12 -149 Q18 -146 22 -149"/>

        </g>

        <!-- الحقيبة -->
        <g id="bag">
          <path class="ink"
            d="M-27 -99 Q-55 -64 -39 -30"/>
          <path class="cloth"
            d="M-53 -38 Q-49 -48 -36 -43
               L-26 -17 Q-39 -8 -51 -20 Z"/>
        </g>

      </g>

      <text x="20" y="35" fill="#aaa398"
        font-size="12" letter-spacing="2">
        WALK CYCLE / V3
      </text>

    </svg>
  </div>

  <div class="controls">
    <button id="toggle">إيقاف الحركة</button>
    <button id="restart">إعادة التشغيل</button>
  </div>

  <div class="caption">
    Natural Walking · Foot Contact · Two-Bone IK
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

const character = $("character");
const shadow = $("shadow");

let running = true;
let lastTime = 0;
let elapsed = 0;

const cycleDuration = 1.15;
const strideLength = 70;
const travelSpeed = strideLength / cycleDuration;

const legLengthA = 72;
const legLengthB = 76;

const clamp = (v, min, max) =>
  Math.max(min, Math.min(max, v));

const lerp = (a, b, t) =>
  a + (b - a) * t;

function smooth(t) {
  return t * t * (3 - 2 * t);
}

/* حساب الركبة هندسياً باستخدام أطوال العظام */
function solveIK(hip, ankle, upper, lower, bend) {

  let dx = ankle.x - hip.x;
  let dy = ankle.y - hip.y;

  let distance = Math.sqrt(dx * dx + dy * dy);

  distance = clamp(
    distance,
    Math.abs(upper - lower) + .01,
    upper + lower - .01
  );

  const angle = Math.atan2(dy, dx);

  const along =
    (upper * upper - lower * lower + distance * distance)
    / (2 * distance);

  const height = Math.sqrt(
    Math.max(0, upper * upper - along * along)
  );

  const baseX = Math.cos(angle) * along;
  const baseY = Math.sin(angle) * along;

  const perpendicularX = -Math.sin(angle);
  const perpendicularY = Math.cos(angle);

  return {
    x: hip.x + baseX + perpendicularX * height * bend,
    y: hip.y + baseY + perpendicularY * height * bend
  };
}

/* رسم ساق واحدة وحذائها */
function drawLeg(name, phase, rootX, lift) {

  const hip = { x: 0, y: 0 };

  let footX;
  let footY;
  let stance;

  if (phase < .60) {

    stance = true;

    const u = phase / .60;

    /*
      القدم تتحرك للخلف محلياً بنفس سرعة الجسم
      وبالتالي تظل ثابتة تقريباً بالنسبة للأرض.
    */
    footX = lerp(24, -18, u);
    footY = 112;

  } else {

    stance = false;

    const u = (phase - .60) / .40;
    const s = smooth(u);

    footX = lerp(-18, 24, s);
    footY = 112 - Math.sin(Math.PI * u) * 25;
  }

  const ankle = { x: footX, y: footY };

  const knee = solveIK(
    hip,
    ankle,
    legLengthA,
    legLengthB,
    name === "front" ? 1 : -1
  );

  const thickness = name === "front" ? 15 : 13;

  const path = `
    M ${hip.x - thickness/2} ${hip.y}
    Q ${knee.x - thickness/2} ${knee.y - 5}
      ${ankle.x - thickness/2} ${ankle.y}
    L ${ankle.x + thickness/2} ${ankle.y}
    Q ${knee.x + thickness/2} ${knee.y - 5}
      ${hip.x + thickness/2} ${hip.y}
    Z
  `;

  $(name + "LegShape").setAttribute("d", path);

  $(name + "LegDetail").setAttribute(
    "d",
    `M ${hip.x} ${hip.y + 12}
     Q ${knee.x} ${knee.y}
     ${ankle.x} ${ankle.y - 5}`
  );

  const shoe = `
    M ${ankle.x - 8} ${ankle.y}
    Q ${ankle.x - 5} ${ankle.y + 8}
      ${ankle.x + 4} ${ankle.y + 9}
    L ${ankle.x + 28} ${ankle.y + 7}
    Q ${ankle.x + 34} ${ankle.y + 5}
      ${ankle.x + 30} ${ankle.y}
  `;

  $(name + "Shoe").setAttribute("d", shoe);

  return { ankle, knee, stance };
}

/* حركة الذراعين */
function drawArms(phase) {

  const swing = Math.sin(phase * Math.PI * 2);

  const backHandX = -17 - swing * 15;
  const backHandY = -30 + Math.cos(phase * Math.PI * 2) * 7;

  const frontHandX = 35 + swing * 15;
  const frontHandY = -30 - Math.cos(phase * Math.PI * 2) * 7;

  $("backArmShape").setAttribute(
    "d",
    `M-5 -105 Q${-15-swing*10} -65 ${backHandX} ${backHandY}`
  );

  $("backArmDetail").setAttribute(
    "d",
    `M-5 -105 Q${-15-swing*10} -65 ${backHandX} ${backHandY}`
  );

  $("backHand").setAttribute(
    "transform",
    `translate(${backHandX+17} ${backHandY+30})`
  );

  $("frontArmShape").setAttribute(
    "d",
    `M27 -103 Q${42+swing*10} -65 ${frontHandX} ${frontHandY}`
  );

  $("frontArmDetail").setAttribute(
    "d",
    `M27 -103 Q${42+swing*10} -65 ${frontHandX} ${frontHandY}`
  );

  $("frontHand").setAttribute(
    "transform",
    `translate(${frontHandX-35} ${frontHandY+30})`
  );
}

function render(time) {

  if (!running) return;

  if (!lastTime) lastTime = time;

  const delta = Math.min((time - lastTime) / 1000, .04);
  lastTime = time;
  elapsed += delta;

  const cycle = (elapsed / cycleDuration) % 1;

  const phaseFront = cycle;
  const phaseBack = (cycle + .5) % 1;

  const travel = elapsed * travelSpeed;

  let rootX = -90 + (travel % 980);

  /*
    اهتزاز الجسم بسيط ومربوط بدورة المشي.
  */
  const bob = Math.abs(Math.sin(cycle * Math.PI * 2)) * 3;

  const bodyRotation = Math.sin(cycle * Math.PI * 2) * 1.4;

  character.setAttribute(
    "transform",
    `translate(${rootX} ${278 - bob}) rotate(${bodyRotation})`
  );

  /*
    الرجل الخلفية تُرسم أولاً حتى لا تحجب الأمامية.
  */
  drawLeg("back", phaseBack, rootX, 0);
  drawLeg("front", phaseFront, rootX, 0);

  drawArms(cycle);

  shadow.setAttribute("cx", rootX);
  shadow.setAttribute("cy", 390);
  shadow.setAttribute(
    "rx",
    36 - bob * .7
  );

  requestAnimationFrame(render);
}

$("toggle").addEventListener("click", () => {

  running = !running;

  $("toggle").textContent =
    running ? "إيقاف الحركة" : "تشغيل الحركة";

  if (running) {
    lastTime = 0;
    requestAnimationFrame(render);
  }
});

$("restart").addEventListener("click", () => {

  elapsed = 0;
  lastTime = 0;

  if (!running) {
    running = true;
    $("toggle").textContent = "إيقاف الحركة";
  }

  requestAnimationFrame(render);
});

requestAnimationFrame(render);
</script>

</body>
</html>
