
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line Art Character Study</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:#e7e2d8;font-family:Georgia,serif
}
.paper{
 width:min(96vw,850px);aspect-ratio:16/10;
 background:#f7f3e9;border-radius:12px;
 box-shadow:0 15px 45px #28231b22;overflow:hidden
}
svg{width:100%;height:100%}
.ink{fill:none;stroke:#37352f;stroke-width:2;
 stroke-linecap:round;stroke-linejoin:round}
.thin{fill:none;stroke:#686258;stroke-width:1.1;
 stroke-linecap:round;stroke-linejoin:round}
.detail{fill:none;stroke:#999080;stroke-width:.8}
.cloth{fill:#e9e3d6;stroke:#37352f;stroke-width:1.8;
 stroke-linejoin:round}
.accent{fill:#929f98;stroke:#37352f;stroke-width:1.5}
.skin{fill:#f0e8d9;stroke:#37352f;stroke-width:1.5}
.head{transform-origin:350px 130px}
.legA{transform-origin:345px 250px;animation:stepA 1.1s infinite ease-in-out}
.legB{transform-origin:345px 250px;animation:stepB 1.1s infinite ease-in-out}
.armA{transform-origin:365px 163px;animation:stepB 1.1s infinite ease-in-out}
.armB{transform-origin:365px 163px;animation:stepA 1.1s infinite ease-in-out}
@keyframes stepA{
 0%,100%{transform:rotate(22deg)}
 50%{transform:rotate(-22deg)}
}
@keyframes stepB{
 0%,100%{transform:rotate(-22deg)}
 50%{transform:rotate(22deg)}
}
</style>
</head>
<body>
<div class="paper">
<svg viewBox="0 0 700 440">
<defs>
 <filter id="grain">
  <feTurbulence type="fractalNoise" baseFrequency=".8"
   numOctaves="2" seed="8"/>
  <feColorMatrix values="0 0 0 0 0.5
   0 0 0 0 0.45 0 0 0 0 0.35 0 0 0 .045 0"/>
 </filter>
</defs>

<!-- Ground -->
<path class="thin" d="M70 371 Q350 367 630 371"/>
<path class="detail" d="M275 375 Q350 370 425 375"/>

<!-- Back leg -->
<g class="legB">
 <path class="ink" d="M337 247 Q326 278 319 304 Q310 328 303 348"/>
 <path class="thin" d="M344 250 Q337 282 329 307 L316 348"/>
 <path class="ink" d="M303 348 Q292 351 285 359 Q298 365 323 360 L330 354"/>
 <path class="thin" d="M292 359 Q306 358 319 360"/>
 <path class="detail" d="M313 319 Q319 321 328 323"/>
</g>

<!-- Front leg -->
<g class="legA">
 <path class="ink" d="M350 248 Q362 278 371 304 Q380 329 390 348"/>
 <path class="thin" d="M358 248 Q371 281 380 308 L399 348"/>
 <path class="ink" d="M390 348 Q406 350 416 359 Q405 366 384 360 L377 355"/>
 <path class="thin" d="M387 357 Q400 358 410 361"/>
 <path class="detail" d="M374 318 Q383 320 390 318"/>
</g>

<!-- Torso and coat -->
<path class="cloth" d="
 M332 151 Q319 157 316 180
 L310 218 Q307 239 323 250
 Q344 262 371 251
 Q389 244 383 220
 L377 180 Q374 157 359 151
 L350 174 Z"/>

<!-- Coat structure -->
<path class="ink" d="M350 174 Q347 198 350 224 L347 250"/>
<path class="thin" d="M333 158 Q340 174 343 190
 Q338 210 339 235"/>
<path class="thin" d="M369 159 Q360 177 359 194
 Q368 216 370 244"/>
<path class="ink" d="M326 190 Q345 199 373 190"/>
<path class="thin" d="M330 211 Q350 219 374 211"/>
<path class="thin" d="M331 232 Q350 239 373 231"/>
<circle cx="354" cy="205" r="2" fill="#37352f"/>
<circle cx="354" cy="222" r="2" fill="#37352f"/>
<path class="ink" d="M325 246 Q349 256 377 246"/>

<!-- Neck -->
<path class="skin" d="M338 127 L338 151
 Q350 164 364 150 L362 126"/>

<!-- Collar and scarf -->
<path class="accent" d="M335 146 Q350 159 365 144
 L375 158 Q357 175 336 159 Z"/>
<path class="accent" d="M361 153 Q378 159 382 179
 Q373 173 365 184 L358 163 Z"/>
<path class="thin" d="M367 161 Q374 166 376 173"/>

<!-- Arms -->
<g class="armB">
 <path class="cloth" d="M321 161 Q307 172 301 194
 L291 224 L302 230 Q316 208 324 190 L334 172 Z"/>
 <path class="ink" d="M291 224 Q284 232 287 244
 Q292 252 300 244 L305 230"/>
 <path class="thin" d="M294 232 Q298 238 300 245"/>
</g>
<g class="armA">
 <path class="cloth" d="M373 160 Q388 169 396 192
 L410 218 L400 227 Q385 207 379 192 L364 175 Z"/>
 <path class="ink" d="M410 218 Q420 225 420 237
 Q415 247 407 239 L400 227"/>
 <path class="thin" d="M412 231 Q408 236 407 241"/>
</g>

<!-- Head -->
<g class="head">
 <path class="skin" d="M328 105
 Q326 76 346 67 Q371 64 380 87
 Q385 101 378 125 Q371 144 352 146
 Q333 141 329 123 Z"/>
 <!-- Hair -->
 <path class="ink" d="M328 111 Q320 87 333 72
 Q346 57 366 65 Q383 70 384 94
 Q376 82 366 81 Q350 91 330 90"/>
 <path class="thin" d="M332 86 Q343 68 358 69"/>
 <path class="thin" d="M365 70 Q377 76 380 88"/>
 <!-- Face profile -->
 <path class="ink" d="M376 107 Q383 111 389 115
 Q383 119 377 119"/>
 <path class="thin" d="M373 100 Q377 97 381 100"/>
 <path class="ink" d="M370 127 Q360 132 352 128"/>
 <path class="thin" d="M351 128 Q357 136 365 131"/>
 <circle cx="372" cy="104" r="1.5" fill="#37352f"/>
 <!-- Ear -->
 <path class="thin" d="M335 108 Q326 105 328 117
 Q330 125 337 120"/>
 <path class="detail" d="M332 112 Q338 111 334 117"/>
</g>

<!-- Hair details -->
<path class="thin" d="M334 78 Q345 60 360 67"/>
<path class="thin" d="M340 83 Q351 72 365 76"/>
<path class="detail" d="M330 96 Q336 91 341 91"/>

<!-- Paper texture -->
<rect width="700" height="440" filter="url(#grain)" opacity=".16"/>
</svg>
</div>
</body>
</html>
