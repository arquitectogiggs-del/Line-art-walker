<body>

<div class="controls">
 <button id="toggle">Pause</button>
 <button id="slower">Slow</button>
 <button id="faster">Fast</button>
 <button id="normal">Normal</button>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

const walker = $('walker');

const CONFIG = {
 speed:85,
 stride:72,
 stance:0.62,
 ground:357,
 upper:58,
 lower:58
};

let running=true;
let x=760;
let previous=0;
let travel=0;

let scarfAngle=0;
let scarfVelocity=0;
let coatAngle=0;
let coatVelocity=0;
let bagAngle=0;
let bagVelocity=0;

const mod=(v,n)=>((v%n)+n)%n;
const mix=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function gait(phase){

 phase=mod(phase,1);

 if(phase<CONFIG.stance){

  const p=phase/CONFIG.stance;

  return {
   x:mix(
    -CONFIG.stride/2,
    -CONFIG.stride/2+CONFIG.stride*CONFIG.stance,
    p
   ),
   y:0,
   stance:true,
   progress:p
  };

 }

 const p=(phase-CONFIG.stance)/(1-CONFIG.stance);

 return {
  x:mix(
   -CONFIG.stride/2+CONFIG.stride*CONFIG.stance,
   -CONFIG.stride/2,
   p
  ),
  y:-Math.sin(Math.PI*p)*35,
  stance:false,
  progress:p
 };

}

function solveIK(hip,foot){

 const dx=foot.x-hip.x;
 const dy=foot.y-hip.y;

 const distance=clamp(
  Math.hypot(dx,dy),
  1,
  CONFIG.upper+CONFIG.lower-.01
 );

 const a=(
  CONFIG.upper**2-
  CONFIG.lower**2+
  distance**2
 )/(2*distance);

 const h=Math.sqrt(
  Math.max(0,CONFIG.upper**2-a**2)
 );

 const ux=dx/distance;
 const uy=dy/distance;

 // Forward-facing knee bend
 return {
  x:hip.x+ux*a-uy*h,
  y:hip.y+uy*a+ux*h
 };

}

function segmentPath(a,b,width){

 const dx=b.x-a.x;
 const dy=b.y-a.y;
 const length=Math.hypot(dx,dy)||1;

 const nx=-dy/length*width;
 const ny=dx/length*width;

 return `
 M ${a.x+nx} ${a.y+ny}
 Q ${(a.x+b.x)/2+nx*1.1}
   ${(a.y+b.y)/2+ny*1.1}
   ${b.x+nx*.5} ${b.y+ny*.5}

 M ${a.x-nx} ${a.y-ny}
 Q ${(a.x+b.x)/2-nx*1.1}
   ${(a.y+b.y)/2-ny*1.1}
   ${b.x-nx*.5} ${b.y-ny*.5}
 `;

}

function drawLeg(prefix,hipX,phase){

 const step=gait(phase);

 const hip={x:hipX,y:267};

 const ankle={
  x:hipX+step.x,
  y:CONFIG.ground-7+step.y
 };

 const knee=solveIK(hip,ankle);

 const upper=segmentPath(hip,knee,9);
 const lower=segmentPath(knee,ankle,6.5);

 $(prefix+'Upper').setAttribute('d',upper);
 $(prefix+'Lower').setAttribute('d',lower);

 const sx=ankle.x;
 const sy=ankle.y;

 const rotation=step.stance?0:
  -Math.cos(Math.PI*step.progress)*12;

 const foot=`
 M ${sx-5} ${sy-4}
 Q ${sx-15} ${sy+2} ${sx-24} ${sy+5}
 Q ${sx-30} ${sy+10} ${sx-15} ${sy+11}
 L ${sx+11} ${sy+9}
 Q ${sx+17} ${sy+5} ${sx+6} ${sy-4}Z
 `;

 $(prefix+'Shoe').setAttribute(
  'd',
  foot
 );

 $(prefix+'Shoe').setAttribute(
  'transform',
  `rotate(${rotation} ${sx} ${sy})`
 );

 $(prefix+'ShoeDetail').setAttribute(
  'd',
  `M ${sx-19} ${sy+6}
   Q ${sx-4} ${sy+9} ${sx+11} ${sy+6}`
 );

 return step;

}

function drawArm(id,phase,side){

 const shoulder={
  x:350+side*25,
  y:166
 };

 const swing=Math.cos(phase*Math.PI*2)*23;

 const elbow={
  x:shoulder.x+swing*.65+side*8,
  y:shoulder.y+39
 };

 const hand={
  x:shoulder.x+swing+side*13,
  y:shoulder.y+78
 };

 const upper=segmentPath(shoulder,elbow,8.5);
 const lower=segmentPath(elbow,hand,6);

 $(id+'Shape').setAttribute(
  'd',
  upper+lower
 );

 $(id+'Detail').setAttribute(
  'd',
  `M ${elbow.x-4} ${elbow.y}
   Q ${elbow.x} ${elbow.y+5} ${elbow.x+4} ${elbow.y+9}`
 );

 $(id.replace('Arm','Hand')).setAttribute(
  'd',
  `M ${hand.x-5} ${hand.y}
   Q ${hand.x-9} ${hand.y+9} ${hand.x-3} ${hand.y+14}
   Q ${hand.x+7} ${hand.y+17} ${hand.x+8} ${hand.y+7}
   L ${hand.x+3} ${hand.y-3}Z`
 );

}

function spring(current,velocity,target,dt){

 const stiffness=22;
 const damping=8;

 velocity+=(target-current)*stiffness*dt;
 velocity*=Math.exp(-damping*dt);
 current+=velocity*dt;

 return {current,velocity};

}

function update(dt){

 travel+=CONFIG.speed*dt;

 x-=CONFIG.speed*dt;

 if(x<-140){
  x=840;
  travel=0;
 }

 const phase=travel/CONFIG.stride;

 const frontPhase=mod(phase,1);
 const backPhase=mod(phase+.5,1);

 const frontStep=drawLeg(
  'front',
  343,
  frontPhase
 );

 const backStep=drawLeg(
  'back',
  357,
  backPhase
 );

 // Arms move opposite to legs
 drawArm('frontArm',backPhase,1);
 drawArm('backArm',frontPhase,-1);

 // Subtle body movement
 const bodyBob=
  (frontStep.y+backStep.y)*-.025;

 $('torso').setAttribute(
  'transform',
  `translate(0 ${bodyBob})`
 );

 $('head').setAttribute(
  'transform',
  `translate(0 ${bodyBob})`
 );

 // Secondary motion
 const wave=Math.sin(phase*Math.PI*2);

 let s=spring(
  scarfAngle,
  scarfVelocity,
  -wave*.13,
  dt
 );

 scarfAngle=s.current;
 scarfVelocity=s.velocity;

 let c=spring(
  coatAngle,
  coatVelocity,
  -wave*.10,
  dt
 );

 coatAngle=c.current;
 coatVelocity=c.velocity;

 let b=spring(
  bagAngle,
  bagVelocity,
  wave*.06,
  dt
 );

 bagAngle=b.current;
 bagVelocity=b.velocity;

 $('scarfTail').setAttribute(
  'transform',
  `rotate(${scarfAngle*30} 329 145)`
 );

 $('coatTail').setAttribute(
  'transform',
  `rotate(${coatAngle*25} 312 255)`
 );

 $('bag').setAttribute(
  'transform',
  `rotate(${bagAngle*30} 310 190)`
 );

 walker.setAttribute(
  'transform',
  `translate(${x-350} 0)`
 );

}

function frame(time){

 if(!running)return;

 if(!previous)previous=time;

 const dt=Math.min(
  (time-previous)/1000,
  .035
 );

 previous=time;

 update(dt);

 requestAnimationFrame(frame);

}

function play(){

 if(running)return;

 running=true;
 previous=0;

 $('toggle').textContent='Pause';

 requestAnimationFrame(frame);

}

function pause(){

 running=false;

 $('toggle').textContent='Play';

}

$('toggle').onclick=()=>{
 running?pause():play();
};

$('slower').onclick=()=>{
 CONFIG.speed=45;
};

$('faster').onclick=()=>{
 CONFIG.speed=125;
};

$('normal').onclick=()=>{
 CONFIG.speed=85;
};

requestAnimationFrame(frame);

</script>

</body>
